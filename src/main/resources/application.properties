spring.application.name=nova-assistant
server.port=${PORT:8080}
nova.alexa.application-id=${NOVA_ALEXA_APPLICATION_ID:}
nova.openai.api-key=${OPENAI_API_KEY:}
nova.openai.model=${OPENAI_MODEL:gpt-5-nano}
nova.openai.max-input-chars=${OPENAI_MAX_INPUT_CHARS:800}
nova.openai.max-output-tokens=${OPENAI_MAX_OUTPUT_TOKENS:160}
nova.openai.reasoning-effort=${OPENAI_REASONING_EFFORT:minimal}
nova.openai.text-verbosity=${OPENAI_TEXT_VERBOSITY:low}
nova.openai.rate-limit.requests=${OPENAI_MAX_REQUESTS_PER_WINDOW:20}
nova.openai.rate-limit.window-minutes=${OPENAI_RATE_LIMIT_WINDOW_MINUTES:60}
